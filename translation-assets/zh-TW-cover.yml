        align: left
      - id: back_body
        type: text
        role: body
        text: |-
          這裡會放唐鳳與格林的內容簡介！請注意，這段副標比標題稍微內縮。下方也可以加入推薦語。
        box: [454, 1903, 4720, 3147]
        font: 155
        line: 205
        color: "#111111"
        align: left
      - id: back_quote_one
        type: text
        role: body
        text: |-
          「我剛才看見一兆種不同的現實彼此摺疊，像薄薄的金屬片鍛成一把刀。」
          ——奇迪・阿納貢耶
        box: [1504, 4653, 5348, 5747]
        font: 135
        line: 180
        color: "#111111"
        align: center
        emphasis:
          - text: 奇迪・阿納貢耶
            bold: true
      - id: back_quote_two
        type: text
        role: body
        text: |-
          「對對對，就是那把時間之刀。」
          ——麥可
        box: [2504, 6103, 5348, 6897]
        font: 145
        line: 190
        color: "#111111"
        align: center
        emphasis:
          - text: 麥可
            bold: true
