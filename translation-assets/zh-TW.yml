    md: |-
      ![img-0.jpeg](img-0.jpeg)
      
      # 共生力
      
      ## 問題：
      
      別把整個社會放進同一個籃子。
      
      我們現代的文化、新聞與政治，全都經過少數幾家跨國公司經營的平台。
      
      但這造成了「單點故障」！無論是出於意外，還是蓄意的貪婪，這些平台都可能讓我們失望。
      
      ![img-1.jpeg](img-1.jpeg)
      
      ![img-2.jpeg](img-2.jpeg)
      
      而就算這些中心化平台不出事，「成功」仍然糟糕：一種平淡、一體適用的文化，欠缺由信仰、地方社群等構成的「厚實中間層」。
      
      ![img-3.jpeg](img-3.jpeg)
