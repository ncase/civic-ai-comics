      人們所重視的：
      誠實、文化流暢
      度、衝突調解、
      心理健康最佳實
      務……諸如此類
      ！
      
      每項價值都以多種
      不同方式衡量，以
      求穩健。
      
      而且有回饋循
      環：我們評估
      這些評測，並
      加以改進。
      
      這就是我們設計以價
      值為本的「羅盤」來
      引導科技的方法！
      
