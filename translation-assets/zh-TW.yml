  Ch1_A:
    source_size: [1437, 1999]
    target_size: [5749, 8000]
    md: |-
      ![img-0.jpeg](img-0.jpeg)
      
      # 覺察力
      
      ## 問題：
      
      政府需要聽取人民的需求。但目前，公民參與政治最常見的兩種方式是……
      
      每隔幾年投一次
      單選題，
      
      ![img-1.jpeg](img-1.jpeg)
      
      我投票給：
      
      ○ 壞人
      ○ 更壞的人
      ○ 毫無勝算的人
      
      且
      或
      
      在新聞和社群媒體上
      無所不用其極的叫罵混戰，
      誰最聳動誰就贏。
      
      ![img-2.jpeg](img-2.jpeg)
      
      與鄰居面對面交流固然很好，但你只能觸及「自己」的在地
      同溫層，而非所有公民。那麼，我們能否設計一個能擴展到
      所有公民的流程，而且還能……
      
      ![img-3.jpeg](img-3.jpeg)
      
      凸顯我們意見一致的
      事實與價值，
      
      ![img-4.jpeg](img-4.jpeg)
      
      讓我們在意見分歧之處
      保持建設性，
      
      ![img-5.jpeg](img-5.jpeg)
      
      並幫助我們
      創造出新的解方？
