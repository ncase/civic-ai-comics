  Ch2_A:
    source_size: [1437, 1999]
    target_size: [5749, 8000]
    md: |-
      ![img-0.jpeg](img-0.jpeg)
      
      # 負責力
      
      ## 問題：
      
      偉大的計畫往往需要眾多人手……但
      眾多人手通常導致大量的責任推卸。
      
      當沒有人負責，就沒有人負責。
      
      ![img-1.jpeg](img-1.jpeg)
      
      舉例來說：2024 年，台灣的臉書動態充斥著 AI 生成的詐騙。
      輝達（Nvidia）台灣裔執行長黃仁勳的擬真深偽影片，騙走人
      們數百萬美元。臉書的回應？「那則廣告不是我們做的；是我
      們的演算法把它推送給你的。」毫無責任可言。
      
      我只是聽命令／隨誘因／跟著大家走。
