  Ch5_B:
    source_size: [1437, 1999]
    target_size: [5749, 8000]
    md: |-
      # 不要相互保證毀滅
      
      # 而要盡可能雙贏
      
      # 解方：
      
      退一步想。在你想要的「做什麼」背後，問問自己：你「為何」想要它？接著：你能不能創造一個同時滿足雙方「為何」的新「做什麼」？
      
      舉例來說，也許我們的兩位主廚會對彼此說……
      
      ……而他們發現，雙方都能100% 滿足需求，毫無浪費！
      
      ![img-0.jpeg](img-0.jpeg)
      
      ![img-1.jpeg](img-1.jpeg)
      
      沒錯，這例子有點刻意，但雙贏在現實生活中其實常常找得到！幾年前，台灣曾為了是否更改時區而激烈辯論：
      
      但在 pol.is 與參與官的協助下，大家找到了能同時滿足雙方「為何」的新「做什麼」：就業金卡居留，把科學家與藝術家帶進台灣。
      
      ![img-2.jpeg](img-2.jpeg)
      
      ![img-3.jpeg](img-3.jpeg)
      
      更好的討論，就是這樣幫助我們達成雙贏的！
