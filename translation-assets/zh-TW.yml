      # 不是：誤導我們的指標
      
      # 而是：由我們、為我們而做的指標
      
      ![img-0.jpeg](img-0.jpeg)
      
      # 解方：
      
      1. 衡量我們真正在乎的事。
      2. 用多種方式衡量。
      3. 經常重新評估指標。
      
      想想 Weval.org，
      一個為 AI 聊天機
      器人打造的評測集
      合，由公眾設計、
      為公眾而做！
      
