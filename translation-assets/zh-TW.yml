    source_size: [1280, 1781]
    target_size: [5749, 8000]
    md: |-
      ## 真的傾聽
      人們想說的話
      
      ![img-0.jpeg](img-0.jpeg)
      
      不是：只聽受歡迎／有權勢的人
      而是：也聽見小眾與弱勢的聲音
      
      ## 真的承諾
      人們在乎的事
      
      ![img-1.jpeg](img-1.jpeg)
      
      不是：空泛理想，說說就算
      而是：具體承諾、有力量的約定
      
      ## 人們檢核「過程」
      
      ![img-2.jpeg](img-2.jpeg)
      
      不是：「相信我們就好啦（微笑）」
      而是：看得見的透明與快速的
      社群反饋
      
      ## 人們檢核「結果」
      
      ![img-3.jpeg](img-3.jpeg)
      
      不是：與我們價值無關的那些指標
      而是：由我們設計、為我們服務的指標
      
      ## 儘量雙贏
      
      ![img-4.jpeg](img-4.jpeg)
      
      不是：保證玉石俱焚
      而是：讓每一邊都更好的協議
      
      ## 儘量在地
      
      ![img-5.jpeg](img-5.jpeg)
      
      不是：一體適用的中央霸主
      而是：由多元社群為自己打造的
      多樣解方
      
      ![img-6.jpeg](img-6.jpeg)
