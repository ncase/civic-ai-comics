  Ch2_B:
    source_size: [1437, 1999]
    target_size: [5749, 8000]
    md: |-
      # 不要模糊的承諾
      而要明確的承諾
      
      ## 解方：
      
      我們需要可稽核的「參與契約」。針對專案中的每項任務，我們都指派：
      
      誰
      做什麼
      何時
      為何
      如何
      
      「誰」是負責這項任務的那個人（或少數幾人）？
      
      他們該「做什麼」？
      
      他們該「何時」做？
      
      「為何」要做？記住目的，能讓任務保有意義，也讓負責的人能自行決定……
      
      「如何」去做，應該交給負責的人決定。這樣一來，我們既能落實責任，又不必事事微觀管理。保留人的自主！
      
      回到臺灣的深偽案例：一場公民大會承擔起責任，集思廣益制定出 85% 以上公民都認同的法律，在避免詐騙與避免審查之間取得平衡。這些法律對廣告商與平臺課以公平卻明確的責任。結果：一年之內，深偽詐騙就下降了 94%！
      
      這就是我們如何同時兼顧責任與自主！
