  Ch1_B:
    source_size: [1437, 1999]
    target_size: [5749, 8000]
    md: |-
      # 不只是有權有勢者/
      
      # 而是每個社群的聲音
      
      # 解方：
      
      公民大會就像陪審團——找來一群具代表性的公民樣本聚在一起，把事情好好談清楚。舉辦大會通常成本很高，但公民科技能讓我們舉辦更多場大會，做出更多決策！
      
      ![img-0.jpeg](img-0.jpeg)
      
      想想看台灣如何用 pol.is 來決定要不要、以及如何讓 Uber 進入台灣：
      
      為了避免社群媒體那種有毒的自我膨脹，pol.is 沒有「分享」鈕，甚至連「回覆」鈕都沒有。人們分享想法，其他人則投票表示同意/不同意/不確定：
      
      從這些資料中，我們看見形成了哪些群體……
      
      ……並凸顯出最能跨越分歧的想法！
      
      ![img-1.jpeg](img-1.jpeg)
      
      ![img-2.jpeg](img-2.jpeg)
      
      ![img-3.jpeg](img-3.jpeg)
      
      這樣一來，我們用科技不是要取代我們的發聲，而是要增強我們的發聲！一位數位引導者，幫助我們更好地求同、也更好地存異，一起解決我們共同的問題。
      
      ![img-4.jpeg](img-4.jpeg)
