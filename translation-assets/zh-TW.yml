  Ch4_A:
    source_size: [1437, 1999]
    target_size: [5749, 8000]
    md: |-
      ![img-0.jpeg](img-0.jpeg)
      
      # 回應力
      
      ## 問題：
      
      ![img-1.jpeg](img-1.jpeg)
      
      就像航海者需要羅盤，社會也需要一種方法來衡量我們前進的方向。所以，我們使用指標！但可惜，指標往往會失靈。
      
      舉例來說，決策者也許會說「平均收入」上升了……
      
      但「平均」掩蓋了一個事實：上層階級收入大幅上升，下層階級卻停滯甚至下降。
      
      ![img-2.jpeg](img-2.jpeg)
      
      |  指標 | 失靈  |
      | --- | --- |
      |  點擊 | 標題黨  |
      |  留言 | 激怒式論戰  |
      |  使用者好評 | 諂媚的聊天機器人  |
      
      同樣地，那些運行現代媒體——並因此運行現代文化與政治——的演算法與 AI，所用的指標都有著惡名昭彰的失靈。
      
      那我們該如何衡量我們所重視的——我們的「羅盤」——而不被誤導？
