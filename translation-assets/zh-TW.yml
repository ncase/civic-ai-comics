  Ch5_A:
    source_size: [1437, 1999]
    target_size: [5749, 8000]
    md: |-
      # 團結力
      
      # 問題：
      
      每當大家想要不同的東西，我們往往陷入：「負和」或「零和」思維。
      
      這是什麼意思？想像兩位都想要一顆橘子的廚師：
      
      他們可以為之爭鬥，結果兩敗俱傷：「負和」。
      
      ![img-0.jpeg](img-0.jpeg)
      
      ![img-1.jpeg](img-1.jpeg)
      
      平分橘子比較好，但這仍假設我的所得是你的所失：收益加總為零：「零和」。
      
      但他們能雙方都獲益嗎？也就是「正和」？這也許不總是辦得到，但錯失良機就太可惜了。那麼，該如何盡可能追求「雙贏」呢？
      
      ![img-2.jpeg](img-2.jpeg)
      
      ![img-3.jpeg](img-3.jpeg)
      
      *這個橘子故事源自 Follett (1925)、Fisher & Ury (1981) 與 Covey (1989)
