    md: |-
      # 不要「相信我們就好啦」
      
      # 而要人人都能檢查流程
      
      # 解方：
      
      這些影響每個人的演算法，應該人人都能檢視！
      
      想想 X 上的 Community Notes（前身是 Twitter 的 Birdwatch）。它的運作方式，是凸顯出通常意見相左的人都認同之處。目前為止，它是唯一一個在美國政治光譜上各方都獲得淨正面評價的主要「事實查核」平台！
      
      ![img-0.jpeg](img-0.jpeg)
      
      一部分的原因，是任何人都能檢查演算法的任一環節。使用者能看見所有輸入：（使用者提交的註記）
      
      使用者能檢查註記是否被正確分析：（程式碼開放公開）
      
      最後，使用者能檢查輸出：被凸顯出的註記，的確都是意見相左的人都認同之處。
      
      Community Notes 只是眾多範例之一！重點在於：若要「信任流程」，我們就必須能夠檢查流程。
