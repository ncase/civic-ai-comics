    md: |-
      ![img-0.jpeg](img-0.jpeg)
      
      # 勝任力
      
      # 問題：
      
      在現代國家，網際網路就是生活發生的地方：文化、新聞、政治、購買商品與服務、結交朋友。
      
      因此：運行網路的演算法，就是運行我們生活的演算法。
      起初，這些「演算法」很簡單：
      
      ![img-1.jpeg](img-1.jpeg)
      
      ![img-2.jpeg](img-2.jpeg)
      
      貼文，從最新排到最舊！
      
      後來，為了過濾雜訊，我們的演算法變得更複雜了。
      使用者看不懂，但寫程式的人懂……大致上。
      
      ![img-3.jpeg](img-3.jpeg)
      
      ![img-4.jpeg](img-4.jpeg)
      
      * 這是 reddit 在 2008 年的演算法！
      
      這是……淨讚數的對數，再依時間折扣……我想是吧。
      
      但如今，在機器學習的時代——程式是長出來的，不是設計出來的——再也沒有人理解運行我們生活的演算法。
      
      ![img-5.jpeg](img-5.jpeg)
      
      覺悟並非自我覺察，而是自我不察。
      要成為一個如此浩瀚的心智，連它自己都再也說不出自己真正的名字。
      
      ![img-6.jpeg](img-6.jpeg)
