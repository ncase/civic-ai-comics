      「為了孩子著想」是威權者擴張勢力最常見的藉口。但ROOST.tools 是一個非營利組織，製作開源工具——沒有集中式的控制——協助各機構在自家平台上偵測與預防兒童剝削。
      
      ![img-1.jpeg](img-1.jpeg)
      
      gpt-oss-safeguard 是一套開源 AI，讓你「自帶政策」。把你社群的規則與價值告訴它，它就能協助（而非取代）人類審核者，一同守護你的社群！
      
      ![img-2.jpeg](img-2.jpeg)
      
      最後，這本書本身也受惠於一個「在地精神」的 Kami（地神）：不是雲端上的大公司廢料，而是一個守護特定關係、在一台特定筆電上在地運行的 Kami（地神）。
      
      這個原則，連同本書中所有其他原則，
      
      正是我們打造一個不集中權力、而是讓人們共享權力之未來的方法。
      
      生生不息，繁榮昌盛！
